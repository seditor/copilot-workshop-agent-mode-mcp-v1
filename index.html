<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <header class="app-header">
      <div class="header-topline">
        <p class="eyebrow">Daily focus</p>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false"></button>
      </div>
      <h1 id="app-title">我的待辦清單</h1>
      <p class="subtitle">把今天重要的事，一件一件完成。</p>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">待辦事項內容</label>
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        placeholder="輸入新的待辦事項..."
        maxlength="100"
      >
      <button class="add-button" type="submit">新增</button>
    </form>

    <nav class="filter-bar" aria-label="待辦事項篩選">
      <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">全部</button>
      <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
      <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
    </nav>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
    <p id="empty-state" class="empty-state" hidden></p>

    <footer class="app-footer">
      <span id="remaining-count">未完成:0 項</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
